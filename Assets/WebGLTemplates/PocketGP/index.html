<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Grand Prix</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102638;color:#f8eed9;font-family:system-ui,sans-serif}#stage{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 50% 20%,#31596b,#102638 75%);padding:28px}small{letter-spacing:.23em;color:#54e3c5}h1{font-size:clamp(32px,6vw,74px);line-height:.95;margin:24px 0}p{color:#b5ccd0}progress{width:min(340px,80vw);height:10px;accent-color:#54e3c5;margin:16px auto}button{background:#54e3c5;border:0;border-radius:6px;color:#102638;font-weight:700;padding:12px;cursor:pointer}#fullscreen{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));font-size:11px;padding:5px 9px;opacity:.65}#error{max-width:620px;white-space:pre-wrap;color:#ffc1a8}#launch{font-size:20px;margin:20px auto;min-width:240px}
</style>
</head>
<body>
<div id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="Pocket Grand Prix, jeu de course"></canvas>
<div id="loading"><small>MINIATURE RACING CLUB</small><h1>POCKET<br>GRAND PRIX</h1><p>Petites voitures. Grandes courses.</p><progress id="progress" value="0" max="1"></progress><p id="status">Prêt pour le départ ?</p><button id="launch">LANCER LE JEU</button><p id="error" role="alert"></p></div>
<button id="fullscreen" aria-label="Passer en plein écran">PLEIN ÉCRAN</button></div>
<script>
const canvas=document.getElementById('unity-canvas');let instance;
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Pocket Studio',productName:'Pocket Grand Prix',productVersion:'1.0.0',devicePixelRatio:window.devicePixelRatio||1};
const status=document.getElementById('status'),error=document.getElementById('error');
function failed(message){status.textContent='Le jeu n’a pas pu démarrer.';error.textContent=String(message)+'\nVérifier que tous les fichiers Build sont en ligne et que WebGL 2 est disponible.';document.getElementById('launch').textContent='RÉESSAYER';document.getElementById('launch').hidden=false;}
document.getElementById('launch').onclick=()=>{if(error.textContent){location.reload();return;}document.getElementById('launch').hidden=true;status.textContent='Chargement du circuit…';const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=()=>failed('Impossible de charger le moteur Unity.');script.onload=()=>{createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p).then(game=>{instance=game;document.getElementById('loading').style.display='none';canvas.focus();}).catch(failed);};document.body.appendChild(script);};
document.getElementById('fullscreen').onclick=()=>{if(instance&&document.fullscreenEnabled)instance.SetFullscreen(1);};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
